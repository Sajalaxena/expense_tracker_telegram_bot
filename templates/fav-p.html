<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0e14">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/pwa.js" defer></script>
<title>Tracksy — Personal Favorites</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #0c0e14;
  --bg-card: rgba(22, 27, 45, 0.8);
  --bg-card-solid: #161b2d;
  --border: rgba(236, 72, 153, 0.15);
  --border-hover: rgba(236, 72, 153, 0.4);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-pink: #ec4899;
  --accent-purple: #8b5cf6;
  --accent-green: #10b981;
  --gradient-primary: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 12px 40px rgba(0, 0, 0, 0.5);
  --radius: 20px;
  --radius-sm: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 24px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header a {
  color: var(--accent-pink);
  text-decoration: none;
  font-size: 0.9rem;
  opacity: 0.8;
}

.header a:hover {
  opacity: 1;
}

.summary-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 28px;
  display: flex;
  gap: 40px;
  align-items: center;
}

.summary-item {
  text-align: center;
}

.summary-item .label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.summary-item .value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent-pink);
}

.summary-item .value.count {
  color: var(--accent-purple);
  font-size: 1.4rem;
}

.month-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.month-filter button {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  padding: 8px 16px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}

.month-filter button.active,
.month-filter button:hover {
  background: var(--accent-pink);
  color: white;
  border-color: var(--accent-pink);
}

.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-card table {
  width: 100%;
  border-collapse: collapse;
}

.table-card th {
  text-align: left;
  padding: 14px 20px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

.table-card td {
  padding: 14px 20px;
  font-size: 0.9rem;
  border-bottom: 1px solid rgba(99, 102, 241, 0.05);
}

.table-card tr:last-child td {
  border-bottom: none;
}

.table-card tr:hover td {
  background: rgba(236, 72, 153, 0.03);
}

.amount {
  font-weight: 600;
  color: var(--accent-pink);
}

.date-col {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.note-col {
  color: var(--text-secondary);
}

.table-card td.del-col {
  width: 1%;
  padding-left: 0;
  text-align: right;
}

.del-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.8rem;
  line-height: 1;
  padding: 4px 6px;
  transition: all 0.2s ease;
}

.del-btn:hover {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.3);
}

.del-btn:disabled {
  opacity: 0.4;
  cursor: wait;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state p {
  margin-top: 12px;
  font-size: 0.9rem;
}

@media (max-width: 600px) {
  .summary-card { flex-direction: column; gap: 20px; }
  .table-card td, .table-card th { padding: 10px 12px; font-size: 0.8rem; }
  .header h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💖 Personal Favorites</h1>
    <a href="/dashboard.html">← Back to Dashboard</a>
  </div>

  <div class="summary-card" id="summary">
    <div class="summary-item">
      <div class="label">Total Spent</div>
      <div class="value" id="total-spent">₹0</div>
    </div>
    <div class="summary-item">
      <div class="label">This Month</div>
      <div class="value" id="month-spent">₹0</div>
    </div>
    <div class="summary-item">
      <div class="label">Items</div>
      <div class="value count" id="item-count">0</div>
    </div>
  </div>

  <div class="month-filter" id="month-filter"></div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Note</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="fav-table">
      </tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">
      <p>💫 No personal favorites yet</p>
      <p>Send "fav 500 headphones" to your bot to add one</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  fetch('/api/data')
    .then(function(r) {
      if (r.status === 401) { window.location.href = '/login.html'; throw new Error('Unauthorized'); }
      return r.json();
    })
    .then(function(data) {
      initPage(data.fav_p || [], data.config || {});
    })
    .catch(function(err) {
      console.error('Error loading fav_p data:', err);
      document.getElementById('empty-state').style.display = 'block';
    });

  // Escape user-supplied text (notes, search terms) before putting it into innerHTML.
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // POSTs to /api/delete; calls onDone() only once the server confirms.
  function deleteItem(kind, id, btn, onDone) {
    btn.disabled = true;
    fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id })
    })
      .then(function(r) {
        if (r.status === 401) { window.location.href = '/login.html'; throw new Error('Unauthorized'); }
        return r.json().then(function(json) {
          if (!r.ok) throw new Error(json.error || 'Delete failed');
        });
      })
      .then(onDone)
      .catch(function(err) {
        btn.disabled = false;
        alert('Could not delete: ' + err.message);
      });
  }

  function indianFormat(amount, currency) {
    currency = currency || '₹';
    amount = Math.round(amount * 100) / 100;
    var intPart = Math.floor(amount);
    var decPart = amount !== intPart ? '.' + (amount).toFixed(2).split('.')[1] : '';
    var intStr = intPart.toString();
    var formatted;
    if (intStr.length <= 3) {
      formatted = intStr;
    } else {
      var lastThree = intStr.slice(-3);
      var remaining = intStr.slice(0, -3);
      var groups = [];
      while (remaining.length > 2) {
        groups.unshift(remaining.slice(-2));
        remaining = remaining.slice(0, -2);
      }
      if (remaining) groups.unshift(remaining);
      formatted = groups.join(',') + ',' + lastThree;
    }
    return currency + formatted + decPart;
  }

  var allItems = [];
  var pageConfig = {};
  var activeMonth = null;  // null = "All"

  document.getElementById('fav-table').addEventListener('click', function(e) {
    var btn = e.target.closest('.del-btn');
    if (!btn) return;
    var id = parseInt(btn.getAttribute('data-txn-id'), 10);
    var entry = allItems.filter(function(r) { return r.id === id; })[0];
    if (!entry || !confirm('Delete ' + indianFormat(parseFloat(entry.amount), pageConfig.currency) + (entry.note ? ' — ' + entry.note : '') + '?')) return;
    deleteItem('expense', id, btn, function() {
      initPage(allItems.filter(function(r) { return r.id !== id; }), pageConfig);
    });
  });

  // Safe to call again after a delete: rebuilds totals, month filters and the table.
  function initPage(items, config) {
    var currency = config.currency || '₹';
    allItems = items;
    pageConfig = config;

    var filterDiv = document.getElementById('month-filter');
    filterDiv.innerHTML = '';

    if (!items.length) {
      document.getElementById('total-spent').textContent = indianFormat(0, currency);
      document.getElementById('month-spent').textContent = indianFormat(0, currency);
      document.getElementById('item-count').textContent = 0;
      renderTable([], currency);
      return;
    }

    // Calculate totals
    var total = items.reduce(function(s, r) { return s + parseFloat(r.amount); }, 0);
    var now = new Date();
    var currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    var monthTotal = items
      .filter(function(r) { return r.date && r.date.startsWith(currentMonth); })
      .reduce(function(s, r) { return s + parseFloat(r.amount); }, 0);

    document.getElementById('total-spent').textContent = indianFormat(total, currency);
    document.getElementById('month-spent').textContent = indianFormat(monthTotal, currency);
    document.getElementById('item-count').textContent = items.length;

    // Get unique months
    var months = [];
    var monthSet = {};
    items.forEach(function(r) {
      if (r.date) {
        var m = r.date.substring(0, 7);
        if (!monthSet[m]) { monthSet[m] = true; months.push(m); }
      }
    });
    months.sort().reverse();

    // Month filter buttons
    if (activeMonth && !monthSet[activeMonth]) activeMonth = null;

    var allBtn = document.createElement('button');
    allBtn.textContent = 'All';
    allBtn.onclick = function() { activeMonth = null; renderTable(items, currency); setActive(allBtn); };
    filterDiv.appendChild(allBtn);
    var activeBtn = allBtn;

    months.forEach(function(m) {
      var btn = document.createElement('button');
      var parts = m.split('-');
      var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      btn.textContent = monthNames[parseInt(parts[1]) - 1] + ' ' + parts[0];
      btn.onclick = function() {
        activeMonth = m;
        renderTable(itemsForMonth(m), currency);
        setActive(btn);
      };
      filterDiv.appendChild(btn);
      if (m === activeMonth) activeBtn = btn;
    });

    function itemsForMonth(m) {
      return items.filter(function(r) { return r.date && r.date.startsWith(m); });
    }

    function setActive(btn) {
      filterDiv.querySelectorAll('button').forEach(function(b) { b.className = ''; });
      btn.className = 'active';
    }

    setActive(activeBtn);
    renderTable(activeMonth ? itemsForMonth(activeMonth) : items, currency);
  }

  function renderTable(items, currency) {
    var tbody = document.getElementById('fav-table');
    var empty = document.getElementById('empty-state');

    if (!items.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = items.map(function(r) {
      return '<tr>' +
        '<td class="date-col">' + esc(r.date) + '</td>' +
        '<td class="note-col">' + esc(r.note) + '</td>' +
        '<td class="amount">' + indianFormat(parseFloat(r.amount), currency) + '</td>' +
        '<td class="del-col"><button class="del-btn" data-txn-id="' + r.id + '" title="Delete entry">🗑</button></td>' +
        '</tr>';
    }).join('');
  }

})();
</script>
</body>
</html>
