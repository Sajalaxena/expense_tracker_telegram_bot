<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0e14">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Tracksy — Offline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0e14; color: #f1f5f9; min-height: 100vh; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .card { max-width: 360px; background: rgba(22,27,45,0.85); border: 1px solid rgba(99,102,241,0.15); border-radius: 20px; padding: 36px 28px; }
  img { width: 64px; height: 64px; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; margin-bottom: 8px; }
  p { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 12px;
    padding: 12px 24px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Tracksy needs an internet connection to load your expenses. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
